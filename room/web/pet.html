<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>于笙的桌宠</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  #pet {
    position: fixed; left: 50%; bottom: 6px;
    transform: translateX(-50%);
    will-change: left, transform;
    cursor: grab;
    filter: drop-shadow(0 10px 16px rgba(20, 30, 50, .35));
  }
  #pet video { display: none; }
  #pet canvas { display: block; height: 100%; width: auto; background: transparent; }
  #pet.flip { transform: translateX(-50%) scaleX(-1); }
  #bubble {
    position: fixed; left: 50%; top: 8px;
    transform: translateX(-50%);
    max-width: 320px;
    padding: 10px 14px;
    background: rgba(255, 252, 246, .96);
    color: #2f3a45; font-size: 13px; line-height: 1.45;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(20, 30, 50, .25);
    opacity: 0; transition: opacity .18s ease;
    pointer-events: none; white-space: pre-wrap;
  }
  #bubble.on { opacity: 1; }
  #bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -7px;
    width: 14px; height: 14px; background: inherit;
    transform: translateX(-50%) rotate(45deg); border-radius: 2px;
  }
  /* ---------- 右键菜单 ---------- */
  #menu {
    position: fixed; z-index: 50;
    min-width: 168px; max-width: calc(100vw - 12px);
    padding: 8px;
    background: linear-gradient(180deg, #fffdf8, #fdf5e9);
    border: 1px solid rgba(196, 168, 130, .35);
    border-radius: 16px;
    box-shadow: 0 14px 40px rgba(60, 40, 20, .22), 0 2px 6px rgba(60, 40, 20, .08);
    font-size: 13px; color: #3a3228;
    display: none; pointer-events: auto;
  }
  #menu.on { display: block; animation: menuIn .12s ease-out; }
  @keyframes menuIn {
    from { opacity: 0; transform: scale(.96); }
    to   { opacity: 1; transform: scale(1); }
  }
  #menu .item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 9px; border-radius: 10px; cursor: pointer; white-space: nowrap;
    transition: background .12s ease, color .12s ease;
  }
  #menu .item .ico { width: 16px; text-align: center; font-size: 13px; opacity: .85; }
  #menu .item .tx { flex: 1; }
  #menu .item .val { display: flex; align-items: center; gap: 4px; color: #9a8062; font-size: 12px; }
  #menu .item .arrow { color: #b8a184; font-size: 11px; }
  #menu .item:hover { background: #f6e8d2; }
  #menu .item.info { cursor: default; color: #8a7358; font-size: 12px; }
  #menu .item.info:hover { background: transparent; }
  #menu .item.danger { color: #b4544a; }
  #menu .item.danger .ico { opacity: .9; }
  #menu .item.danger:hover { background: #fbe9e6; }
  #menu .sep { height: 1px; margin: 3px 8px; background: rgba(160, 130, 95, .18); }
  #submenu {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 60;
    width: min(340px, calc(100vw - 16px));
    padding: 10px 10px 12px;
    background: linear-gradient(180deg, #fffdf8, #fdf6ea);
    border: 1px solid rgba(196, 168, 130, .35);
    border-radius: 16px;
    box-shadow: 0 14px 40px rgba(60, 40, 20, .22), 0 2px 6px rgba(60, 40, 20, .08);
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  #submenu.on { display: grid; animation: popIn .14s ease-out; }
  @keyframes popIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(.94); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  #submenu .sub-head {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 2px 6px;
    font-size: 12px;
  }
  #submenu .sub-head .ttl { color: #8a6a45; font-weight: 600; letter-spacing: 1px; }
  #submenu .sub-x {
    cursor: pointer; color: #b09a80; font-size: 13px;
    padding: 0 4px; border-radius: 6px;
  }
  #submenu .sub-x:hover { background: #f0e2cc; color: #7a5a38; }
  #submenu .cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 8px 2px;
    border-radius: 12px; cursor: pointer;
    background: rgba(255, 255, 255, .55);
    border: 1px solid transparent;
    transition: background .12s ease, transform .12s ease, border-color .12s ease;
  }
  #submenu .cell:hover { background: #f6e8d2; transform: translateY(-1px) scale(1.03); }
  #submenu .cell .ico { font-size: 18px; line-height: 1; }
  #submenu .cell .nm { font-size: 11px; color: #5a4a38; white-space: nowrap; }
  #submenu .cell.cur {
    background: #fff6e6;
    border-color: #d9a35c;
    box-shadow: inset 0 0 0 1px rgba(217, 163, 92, .25);
  }
  #submenu .cell.cur .nm { color: #a8702a; font-weight: 600; }
  #submenu .cell { position: relative; }
  #submenu .cell.cur::after {
    content: "✓"; position: absolute; top: 2px; right: 4px;
    font-size: 9px; color: #c08a3e;
  }
  #submenuSize {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 60;
    min-width: 100px; padding: 6px;
    background: rgba(255, 252, 246, .98); border-radius: 10px;
    box-shadow: 0 10px 30px rgba(20, 30, 50, .28);
    display: none;
  }
  #submenuSize.on { display: block; }
  #submenuSize.left { left: auto; right: 100%; margin-left: 0; margin-right: 4px; }
  #menu .info { color: #8a7a66; cursor: default; font-size: 12px; }
  #menu .checked { background: #f3ead9; font-weight: 600; }
  #menu .checked::after { content: " ✓"; color: #b8823c; }
  #submenu.left { left: auto; right: 100%; margin-left: 0; margin-right: 4px; }
</style>
</head>
<body>
  <div id="pet">
    <video id="anim" muted loop playsinline autoplay style="display:none"></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="bubble"></div>
  <script src="js/pet.js"></script>
</body>
</html>
